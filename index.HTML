<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>DnD Co-Op Adventure</title>
</head>
<body>

    <!-- 1. ΤΙΤΛΟΣ ΠΑΙΧΝΙΔΙΟΥ -->
    <h1>⚔️ The Asynchronous Dungeon 🎲</h1>

    <!-- 2. ΣΤΑΤΙΣΤΙΚΑ ΧΑΡΑΚΤΗΡΑ -->
    <div id="character-box">
        <h3>Hero: <span id="char-name">Barbar</span></h3>
        <p>Life (HP): <span id="char-hp">10</span>/10</p>
    </div>

    <hr> <!-- Μια απλή οριζόντια γραμμή διαχωρισμού -->

    <!-- 3. ΤΟ ΚΕΙΜΕΝΟ ΤΗΣ ΙΣΤΟΡΙΑΣ (Εδώ θα εμφανίζεται τι γράφεις εσύ) -->
    <div id="story-box">
        <h2>Η Περιπέτεια Ξεκινά...</h2>
        <p id="story-text">
            Βρίσκεστε μπροστά σε μια βαριά, σκουριασμένη σιδερένια πόρτα. 
            Από την άλλη πλευρά ακούγεται ένας χαμηλός γρύλισμα. 
            Η σειρά σου να παίξεις, Κώστα!
        </p>
    </div>

    <!-- 4. ΚΟΥΜΠΙΑ ΕΝΕΡΓΕΙΑΣ -->
    <div id="actions-box">
        <button id="btn-action-1">Προσπάθησε να σπάσεις την πόρτα (Θέλει d20 Ζάρι)</button>
        <br><br>
        <button id="btn-action-2">Ψάξε στους γύρω τοίχους για κρυφό μοχλό</button>
    </div>

</body>
</html>
