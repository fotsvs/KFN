<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>DnD Co-Op Adventure</title>
</head>
<body>

    <!-- 1. ΤΙΤΛΟΣ ΠΑΙΧΝΙΔΙΟΥ -->
    <h1>⚔️ The Asynchronous Dungeon 🎲</h1>

    <!-- 2. ΣΤΑΤΙΣΤΙΚΑ ΧΑΡΑΚΤΗΡΑ -->
    <div id="character-box">
        <h3>Hero: <span id="char-name">Barbar</span></h3>
        <p>Life (HP): <span id="char-hp">10</span>/10</p>
    </div>

    <hr> <!-- Μια απλή οριζόντια γραμμή διαχωρισμού -->

    <!-- 3. ΤΟ ΚΕΙΜΕΝΟ ΤΗΣ ΙΣΤΟΡΙΑΣ (Εδώ θα εμφανίζεται τι γράφεις εσύ) -->
    <div id="story-box">
        <h2>The adventure begins...</h2>
        <p id="story-text">
            You find yourself standing before a heavy, dark iron door. 
            From the other side comes a low growl. 
            It's your turn to act, Barbar!
        </p>
    </div>

    <!-- 4. ΚΟΥΜΠΙΑ ΕΝΕΡΓΕΙΑΣ -->
    <div id="actions-box">
        <button id="btn-action-1">Try to break the door (Needs a d20 die)</button>
        <br><br>
        <button id="btn-action-2">Search the walls for a hidden lever</button>
    </div>
</body>
</html>
